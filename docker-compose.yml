version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-itmanager_db}
      POSTGRES_USER: ${DB_USER:-itmanager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itmanager_pass_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-itmanager} -d ${DB_NAME:-itmanager_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-itmanager-modern-key-change-in-prod}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:-Ew3agqdDqKSwtEGoOfritlB_q_Hf4Cv0WhIgxKFW5_B=}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-itmanager_db}
      - DB_USER=${DB_USER:-itmanager}
      - DB_PASSWORD=${DB_PASSWORD:-itmanager_pass_123}
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
